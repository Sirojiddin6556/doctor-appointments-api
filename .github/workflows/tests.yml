name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinic_db
          POSTGRES_USER: clinic_user
          POSTGRES_PASSWORD: clinic_dev_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_user -d clinic_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: clinic_db
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_dev_pass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run system checks
        run: python manage.py check

      - name: Run deploy checks
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-deploy-check-key-not-real-not-real-not-real
          DJANGO_SECURE_SSL_REDIRECT: "False"
          DJANGO_HSTS_SECONDS: "0"

      - name: Run tests
        run: python manage.py test apps --noinput -v 2
